<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
    </div>
</nav>

<div class="container py-5 text-center">
    <div class="mb-4" style="font-size: 6rem;">🔒</div>
    <h1 class="display-4 fw-bold text-danger mb-3">403</h1>
    <h2 class="mb-3">접근이 거부되었습니다</h2>
    <p class="text-muted mb-4">이 페이지에 접근할 권한이 없습니다.<br>관리자(ADMIN) 권한이 필요합니다.</p>
    <a th:href="@{/home}" class="btn btn-primary me-2">홈으로 이동</a>
    <a th:href="@{/products}" class="btn btn-outline-secondary">상품 목록</a>
</div>

<footer class="text-center text-muted py-3 mt-4 border-top">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss', T(java.util.Locale).KOREAN) + '  │  학번: 2171245  │  성명: 민찬혁'}"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
